name: Power dashboard checks

on:
  push:
    branches: [main]
    paths:
      - 'projects/power-performance-dashboard.html'
      - 'tools/check_power_dashboard.py'
      - '.github/workflows/power-dashboard-check.yml'
  pull_request:
    paths:
      - 'projects/power-performance-dashboard.html'
      - 'tools/check_power_dashboard.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate power performance dashboard
        run: python3 tools/check_power_dashboard.py
